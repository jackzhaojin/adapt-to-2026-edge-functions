kind: 'CDN'
version: '1'
data:
  originSelectors:
    rules:
      # Each rule sends a matching request to the Edge Function instead of the
      # normal Edge Delivery origin. originName MUST be edgefunction-<name from edgeFunctions.yaml>.
      # NOTE: these rules only take effect on a custom domain mapped to the Adobe Managed CDN,
      # never on *.aem.page / *.aem.live. Add a domain guard once the domain is known, e.g.
      #   when: { allOf: [ { reqProperty: domain, equals: "edge.example.com" }, { reqProperty: path, equals: "/status" } ] }
      - name: route-status-to-edge-function
        when: { reqProperty: path, equals: "/status" }
        action:
          type: selectAemOrigin
          originName: edgefunction-adapt-edge-function
          skipCache: false
      - name: route-hello-world-to-edge-function
        when: { reqProperty: path, equals: "/hello-world" }
        action:
          type: selectAemOrigin
          originName: edgefunction-adapt-edge-function
          skipCache: true
      - name: route-weather-to-edge-function
        when: { reqProperty: path, equals: "/weather" }
        action:
          type: selectAemOrigin
          originName: edgefunction-adapt-edge-function
          skipCache: true
